name: deployer

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"

      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o cotizacion-telegram .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cotizacion-telegram-binary
          path: cotizacion-telegram

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: cotizacion-telegram-binary

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          touch ~/.ssh/known_hosts
          ssh-keyscan -H ${{ secrets.SERVER }} >> ~/.ssh/known_hosts
          echo "${{ secrets.KEY }}" > ./private_key
          chmod 600 ./private_key

      - name: Deploy production image
        run: |
          ssh -o StrictHostKeyChecking=no -i ./private_key ${{ secrets.USER }}@${{ secrets.SERVER }} "rm -rf /opt/cotizacion-telegram && mkdir -p /opt/cotizacion-telegram"
          ssh -o StrictHostKeyChecking=no -i ./private_key ${{ secrets.USER }}@${{ secrets.SERVER }} "cd /opt/codes/bot-dockers && git pull"
          scp -o StrictHostKeyChecking=no -i ./private_key cotizacion-telegram ${{ secrets.USER }}@${{ secrets.SERVER }}:/opt/cotizacion-telegram/
          ssh -o StrictHostKeyChecking=no -i ./private_key ${{ secrets.USER }}@${{ secrets.SERVER }} "cp /opt/codes/bot-dockers/cotizacion-telegram/docker/cotizacion-telegram.dockerfile /opt/cotizacion-telegram/"
          ssh -o StrictHostKeyChecking=no -i ./private_key ${{ secrets.USER }}@${{ secrets.SERVER }} "cd /opt/cotizacion-telegram && docker build -t localhost:32000/cotizacion-telegram:latest -f cotizacion-telegram.dockerfile ."
          ssh -o StrictHostKeyChecking=no -i ./private_key ${{ secrets.USER }}@${{ secrets.SERVER }} "docker push localhost:32000/cotizacion-telegram:latest"
          ssh -o StrictHostKeyChecking=no -i ./private_key ${{ secrets.USER }}@${{ secrets.SERVER }} "microk8s kubectl apply -f /opt/codes/bot-dockers/cotizaciones/kub/services.yaml"
